; ==========================================================
; TimeDesk - Reloj y estación meteorológica de escritorio (ESP8266)
; ==========================================================
; Hardware: ESP8266 (NodeMCU/Wemos D1 Mini) + ILI9341 TFT + XPT2046 Touch
; ==========================================================

[env:nodemcuv2]
; Versiones fijadas: así una actualización externa de la plataforma o de una
; librería no cambia el firmware sin que lo sepamos. Para actualizarlas, cambia
; la versión aquí y comprueba el resultado en el Pull Request (workflow Compilar).
platform = espressif8266 @ 4.2.1   ; núcleo Arduino ESP8266 3.1.2
board = nodemcuv2
framework = arduino

monitor_speed = 115200
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
    thingpulse/ESP8266 Weather Station @ 2.3.0
    squix78/Mini Grafx @ 1.2.4
    squix78/JsonStreamingParser @ 1.0.5
    ; sin versiones publicadas: commit de 2019 que usaba el registro de PlatformIO
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#26b691b2c84ad93884e262088d3509bc17241278
    bblanchon/ArduinoJson @ 6.21.6

build_flags =
    -D ARDUINO_ESP8266_NODEMCU
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -w

upload_speed = 921600
