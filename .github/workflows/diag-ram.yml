# TEMPORAL: diagnóstico de uso de RAM (no se fusiona en main)
name: Diagnóstico RAM
on:
  push:
    branches: ['claude/estilos-reloj']
jobs:
  ram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Compilar versión actual
        run: pio run -e nodemcuv2 2>&1 | grep -E "RAM:|Flash:|error|SUCCESS|FAILED"
      - name: Mayores consumidores de RAM (versión actual)
        run: |
          TC=$(ls -d ~/.platformio/packages/toolchain-xtensa*/bin | head -1)
          ELF=.pio/build/nodemcuv2/firmware.elf
          $TC/xtensa-lx106-elf-size -A $ELF | grep -E "\.data|\.rodata|\.bss|Total"
          echo "--- top 45 simbolos en RAM (.data/.rodata/.bss) ---"
          $TC/xtensa-lx106-elf-nm -S --size-sort -C $ELF | awk '$3 ~ /[dDbBrR]/' | tail -45
          echo "--- RAM por fichero objeto (rodata+data) ---"
          for o in $(find .pio/build/nodemcuv2/src -name '*.o'); do
            echo "$($TC/xtensa-lx106-elf-size -A $o | awk '/^\.(rodata|data|bss)/{s+=$2} END{print s+0}') $o"; done | sort -n
      - name: Compilar versión antigua (f4b3182) para comparar
        run: |
          git checkout -q f4b3182
          rm -rf .pio/build
          pio run -e nodemcuv2 2>&1 | grep -E "RAM:|Flash:|error|SUCCESS|FAILED"
