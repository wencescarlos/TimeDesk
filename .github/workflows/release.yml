# Compila el firmware y lo publica como GitHub Release (firmware.bin), listo
# para instalarlo desde el portal del reloj: Actualización OTA -> subir .bin.
#
# Cómo publicar una versión:
#   1. Sube la versión en include/version.h (p.ej. 1.2.0)
#   2. git tag v1.2.0 && git push origin v1.2.0
#      (o ejecuta este workflow a mano desde la pestaña Actions)
name: Release firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Leer versión
        id: ver
        run: |
          V=$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"/\1/p' include/version.h)
          [ -n "$V" ] || { echo "::error::No se encontró FIRMWARE_VERSION en include/version.h"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con version.h (v$V)."
            exit 1
          fi

      - name: Compilar
        run: pio run -e nodemcuv2

      - name: Preparar ficheros
        run: |
          mkdir dist
          cp .pio/build/nodemcuv2/firmware.bin dist/firmware.bin
          ls -l dist

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TimeDesk v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: dist/firmware.bin
